[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "card-agent-sdk"
version = "0.1.0"
description = "Kaascan card SDK — generate student ID cards (SINGLE / MULTIPLE) with SVG templates, QR-code API-user auth, and a FastAPI web layer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kaascan" }]
keywords = [
    "card",
    "student-card",
    "id-card",
    "qrcode",
    "pdf",
    "card-sdk",
    "kaascan",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiohttp==3.13.5",
    "aiofiles==24.1.0",
    "aiocache==0.12.3",
    "cloud-unzip==0.1.4",
    "color_cli==0.1.3",
    "cool-qrcode==0.1.3",
    "fonttools==4.62.1",
    "jload==0.7.1",
    "joblib==1.5.3",
    "numpy==2.2.1",
    "Pillow==11.1.0",
    "prettytable==3.17.0",
    "pydantic==2.12.5",
    "PyMuPDF==1.27.2.2",
    "python-barcode==0.15.1",
    "python-cli-ui==0.7.5",
    "python-dotenv==1.0.1",
    "pywriter==2.0.0",
    "qrcode==8.2",
    "requests==2.34.2",
    "requests-cache==1.3.1",
    "super_progress_bar==0.1.0",
    "svg2pdf-py==1.1.0",
]

[project.urls]
Homepage = "https://kaascan.com"
Documentation = "https://docs.kaascan.com"

[tool.setuptools.packages.find]
include = ["card_sdk*"]

[tool.setuptools.package-data]
card_sdk = [
    "fonts/*.otf",
    "fonts/*.ttf",
    "templates/info.json",
    "templates/templates_base/templates.json",
    "templates/templates_base/*/front.*",
    "templates/templates_base/*/back.*",
    "vendored/*.whl",
]